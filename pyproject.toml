[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearts-ai"
version = "0.1.0"
description = "Hearts bot trainer with GUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7.0",
  "pyqtgraph>=0.13.7",
  "numpy>=1.26.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false

[tool.pytest.ini_options]
markers = [
  "slow: long-running tests",
]
